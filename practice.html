<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reinforcement Learning Master Quiz App</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --correct-bg: rgba(34, 197, 94, 0.15);
      --correct-border: #22c55e;
      --correct-text: #4ade80;
      --wrong-bg: rgba(239, 68, 68, 0.15);
      --wrong-border: #ef4444;
      --wrong-text: #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
      padding: 24px 16px;
      min-height: 100vh;
    }
    .container {
      max-width: 860px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      margin-bottom: 28px;
    }
    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: #ffffff;
      margin-bottom: 6px;
    }
    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }
    .nav-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 20px;
    }
    .btn-tab {
      background: var(--card-bg);
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-tab:hover {
      border-color: var(--accent);
      color: var(--text);
    }
    .btn-tab.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
      font-weight: 700;
    }
    .controls-panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 18px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      font-size: 0.9rem;
    }
    .toggle-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .toggle-group label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
    }
    .quiz-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
      margin-bottom: 24px;
    }
    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.3s ease;
    }
    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .badge-module {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.12);
      padding: 4px 10px;
      border-radius: 999px;
    }
    .badge-type {
      font-size: 0.75rem;
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 6px;
    }
    .question-title {
      font-size: 1.18rem;
      font-weight: 600;
      line-height: 1.45;
      margin-bottom: 20px;
    }
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 24px;
    }
    .option-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.4);
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
    }
    .option-item:hover {
      border-color: var(--accent);
      background: rgba(15, 23, 42, 0.8);
    }
    .option-item.selected {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.15);
    }
    .option-item.correct {
      border-color: var(--correct-border) !important;
      background: var(--correct-bg) !important;
    }
    .option-item.wrong {
      border-color: var(--wrong-border) !important;
      background: var(--wrong-bg) !important;
    }
    .option-item.missed {
      border: 1px dashed var(--correct-border) !important;
      background: rgba(34, 197, 94, 0.08) !important;
    }
    .option-box {
      margin-top: 2px;
      width: 18px;
      height: 18px;
      border: 2px solid var(--border);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }
    .option-item.single .option-box {
      border-radius: 50%;
    }
    .option-item.selected .option-box {
      border-color: var(--accent);
      background: var(--accent);
    }
    .option-item.selected .option-box::after {
      content: "";
      width: 6px;
      height: 6px;
      background: #0f172a;
      border-radius: 2px;
    }
    .option-item.single.selected .option-box::after {
      border-radius: 50%;
    }
    .option-content {
      flex: 1;
      font-size: 0.95rem;
    }
    .option-explanation {
      margin-top: 6px;
      font-size: 0.85rem;
      line-height: 1.4;
      display: none;
    }
    .option-item.correct .option-explanation {
      display: block;
      color: var(--correct-text);
    }
    .option-item.wrong .option-explanation {
      display: block;
      color: var(--wrong-text);
    }
    .option-item.missed .option-explanation {
      display: block;
      color: var(--correct-text);
    }
    .btn-action {
      background: var(--accent);
      color: #0f172a;
      font-weight: 700;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .btn-action:hover {
      background: var(--accent-hover);
    }
    .btn-action:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .btn-secondary {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-secondary:hover {
      border-color: var(--text);
      color: var(--text);
    }
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }
    .result-summary-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px 24px;
      text-align: center;
    }
    .result-score {
      font-size: 3rem;
      font-weight: 800;
      color: var(--accent);
      margin: 12px 0;
    }
    .result-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 24px;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Reinforcement Learning Quizzes</h1>
      <p>Interactive practice for all course modules</p>
    </header>

    <div class="nav-bar" id="nav-tabs"></div>

    <div class="controls-panel">
      <div class="toggle-group">
        <label>
          <input type="checkbox" id="shuffle-toggle" /> Shuffle Questions
        </label>
        <label>
          <input type="checkbox" id="exam-mode-toggle" /> Exam Mode (Instant Feedback Off)
        </label>
      </div>
      <div>
        <button class="btn-secondary" id="btn-review-missed" style="font-size: 0.8rem; padding: 6px 12px;">Practice Missed Only</button>
      </div>
    </div>

    <div id="quiz-container"></div>
  </div>

  <script>
    const QUIZ_DATA = [
      // QUIZ 0
      {
        quizId: "0",
        quizName: "Quiz 0: Foundations",
        id: "q0_8",
        question: "What distinguishes reinforcement learning from supervised learning?",
        options: [
          { text: "1. The agent receives labeled input-output pairs.", correct: false, explanation: "This is supervised learning: the training data already contains the target answer or label." },
          { text: "2. The agent learns from a reward signal instead of explicit target labels.", correct: true, explanation: "In RL, the agent is not usually told the correct action. It learns from rewards, often delayed." },
          { text: "3. The data distribution is always stationary.", correct: false, explanation: "The data distribution in RL often changes as the policy changes, because the agent visits different states and actions." },
          { text: "4. The agent interacts with an environment.", correct: true, explanation: "RL is based on an agent-environment loop: observe a state, choose an action, receive reward and next state." }
        ]
      },
      {
        quizId: "0",
        quizName: "Quiz 0: Foundations",
        id: "q0_9",
        question: "In the standard RL setting, what is a policy?",
        options: [
          { text: "1. A mapping from states to actions.", correct: true, explanation: "This is a deterministic policy: \\(\\pi(s) = a\\)." },
          { text: "2. A mapping from rewards to states.", correct: false, explanation: "Rewards evaluate outcomes. They do not specify which action the agent should take." },
          { text: "3. A function that predicts the next state.", correct: false, explanation: "That is a transition model or environment model, not a policy." },
          { text: "4. A probability distribution over actions given a state.", correct: true, explanation: "This is a stochastic policy: \\(\\pi(a|s)\\)." }
        ]
      },
      {
        quizId: "0",
        quizName: "Quiz 0: Foundations",
        id: "q0_10",
        question: "What does the return \\(G_t\\) typically represent?",
        options: [
          { text: "1. Immediate reward at time t.", correct: false, explanation: "That is only one reward. Return means accumulated future reward." },
          { text: "2. Sum of discounted future rewards.", correct: true, explanation: "The usual discounted return is: \\(G_t = R_{t+1} + \\gamma R_{t+2} + \\gamma^2 R_{t+3} + \\dots\\)" },
          { text: "3. The value of the optimal policy.", correct: false, explanation: "The optimal value is \\(V^*\\) or \\(Q^*\\); \\(G_t\\) is a sampled return along a trajectory." },
          { text: "4. The gradient of the policy.", correct: false, explanation: "A policy gradient is used to update policy parameters. It is not the return." }
        ]
      },
      {
        quizId: "0",
        quizName: "Quiz 0: Foundations",
        id: "q0_11",
        question: "What is the role of the discount factor \\(\\gamma\\)?",
        options: [
          { text: "1. Controls how much future rewards are weighted.", correct: true, explanation: "A smaller \\(\\gamma\\) makes the agent care more about near-term rewards. A larger \\(\\gamma\\) gives more weight to later rewards." },
          { text: "2. Ensures convergence in infinite-horizon problems when \\(\\gamma < 1\\).", correct: true, explanation: "With bounded rewards and \\(\\gamma < 1\\) the infinite discounted return stays finite." },
          { text: "3. Determines the learning rate.", correct: false, explanation: "The learning rate is usually \\(\\alpha\\). \\(\\gamma\\) is about future reward weighting." },
          { text: "4. Defines the action space.", correct: false, explanation: "The action space is part of the environment or task definition." }
        ]
      },
      {
        quizId: "0",
        quizName: "Quiz 0: Foundations",
        id: "q0_12",
        question: "What does the Markov property imply?",
        options: [
          { text: "1. The future depends only on the current state and action.", correct: true, explanation: "Given the current state and action, the full past history should not add extra predictive information." },
          { text: "2. The process is deterministic.", correct: false, explanation: "A Markov process can be stochastic. Markov does not mean deterministic." },
          { text: "3. The future depends on the entire history.", correct: false, explanation: "That is the opposite of the Markov property." },
          { text: "4. The current state summarizes all relevant past information.", correct: true, explanation: "This is the core intuition: the state is a sufficient summary of the past." }
        ]
      },
      {
        quizId: "0",
        quizName: "Quiz 0: Foundations",
        id: "q0_13",
        question: "What is the state-value function \\(V_\\pi(s)\\)?",
        options: [
          { text: "1. Expected return starting from state s and following policy \\(\\pi\\).", correct: true, explanation: "This is the definition: \\(V_\\pi(s) = \\mathbb{E}_\\pi[G_t | S_t = s]\\)." },
          { text: "2. Maximum possible reward achievable from state s.", correct: false, explanation: "\\(V_\\pi(s)\\) is tied to a specific policy \\(\\pi\\). It is not simply the maximum possible immediate reward." },
          { text: "3. Expected immediate reward in state s.", correct: false, explanation: "The state-value function includes future discounted rewards, not only the immediate reward." },
          { text: "4. Probability of reaching a terminal state from s.", correct: false, explanation: "That is a different quantity unless the reward function is specially designed to encode terminal reachability." }
        ]
      },
      {
        quizId: "0",
        quizName: "Quiz 0: Foundations",
        id: "q0_14",
        question: "Which algorithms are value-based methods?",
        options: [
          { text: "1. Q-learning", correct: true, explanation: "Q-learning learns an action-value function \\(Q(s,a)\\)." },
          { text: "2. SARSA", correct: true, explanation: "SARSA also learns \\(Q(s,a)\\). It is value-based and on-policy." },
          { text: "3. REINFORCE", correct: false, explanation: "REINFORCE is a policy-gradient method. It directly optimizes the policy rather than primarily learning a value function." }
        ]
      },
      {
        quizId: "0",
        quizName: "Quiz 0: Foundations",
        id: "q0_15",
        question: "Which algorithms are on-policy methods?",
        options: [
          { text: "1. Q-learning", correct: false, explanation: "Q-learning is off-policy because its target uses the greedy next action \\(\\max_a Q(s', a)\\), even when the behavior policy explored." },
          { text: "2. SARSA", correct: true, explanation: "SARSA is on-policy because it updates using the action actually taken by the current behavior policy: \\(Q(S_t, A_t) \\leftarrow Q(S_t, A_t) + \\alpha [R_{t+1} + \\gamma Q(S_{t+1}, A_{t+1}) - Q(S_t, A_t)]\\)." },
          { text: "3. REINFORCE", correct: true, explanation: "REINFORCE learns from trajectories sampled from the current policy, so it is on-policy." }
        ]
      },
      {
        quizId: "0",
        quizName: "Quiz 0: Foundations",
        id: "q0_16",
        question: "Which of the following can help reduce variance in policy gradient methods?",
        options: [
          { text: "1. A baseline function", correct: true, explanation: "A baseline can reduce variance without changing the expected policy gradient." },
          { text: "2. A value function estimator", correct: true, explanation: "A learned \\(V(s)\\) is commonly used as the baseline." },
          { text: "3. Increasing the discount factor above 1", correct: false, explanation: "\\(\\gamma > 1\\) is generally invalid and can make returns grow unboundedly instead of being discounted." },
          { text: "4. Using advantage estimates", correct: true, explanation: "Advantage estimates compare an action to what was expected, which reduces variance: \\(A(s,a) = Q(s,a) - V(s)\\)." }
        ]
      },
      {
        quizId: "0",
        quizName: "Quiz 0: Foundations",
        id: "q0_17",
        question: "In actor-critic methods, what are the roles of the actor and the critic?",
        options: [
          { text: "1. Actor selects actions via a policy.", correct: true, explanation: "The actor is the policy, for example \\(\\pi_\\theta(a | s)\\)." },
          { text: "2. Actor computes the Bellman backup.", correct: false, explanation: "Bellman backups are mainly used to train value estimates, which belongs to the critic side." },
          { text: "3. Critic estimates value functions.", correct: true, explanation: "The critic estimates \\(V(s)\\), \\(Q(s,a)\\), or advantage values." },
          { text: "4. Critic defines the action space.", correct: false, explanation: "The action space is defined by the environment, not by the critic." }
        ]
      },

      // QUIZ 1
      {
        quizId: "1",
        quizName: "Quiz 1: Bandits & Intro",
        id: "q1_1",
        question: "What best describes reinforcement learning?",
        options: [
          { text: "Learning patterns in unlabeled data", correct: false, explanation: "That is unsupervised learning: finding structure without labeled targets." },
          { text: "Learning to predict outputs from labeled examples", correct: false, explanation: "That is supervised learning: input examples come with target labels." },
          { text: "Learning to make decisions through interaction with an environment", correct: true, explanation: "This is the core RL setting: an agent acts, receives feedback, and improves its decision making." },
          { text: "Learning a fixed dataset without feedback", correct: false, explanation: "RL is not just passive learning from a fixed dataset; the agent receives feedback through rewards and affects data collection." }
        ]
      },
      {
        quizId: "1",
        quizName: "Quiz 1: Bandits & Intro",
        id: "q1_2",
        question: "Which characteristics are typical for reinforcement learning?",
        options: [
          { text: "Labeled training targets", correct: false, explanation: "Explicit labels are typical of supervised learning, not RL." },
          { text: "Delayed feedback", correct: true, explanation: "Actions may only show their usefulness after many later rewards." },
          { text: "Sequential decision making", correct: true, explanation: "The current action affects later states, rewards, and choices." },
          { text: "Active data collection", correct: true, explanation: "The agent chooses actions and thereby influences the data it collects." },
          { text: "Independent samples", correct: false, explanation: "RL samples are usually correlated over time because they come from trajectories." }
        ]
      },
      {
        quizId: "1",
        quizName: "Quiz 1: Bandits & Intro",
        id: "q1_3",
        question: "The goal of an agent is to maximize:",
        options: [
          { text: "Immediate rewards", correct: false, explanation: "Optimizing only the next reward can be short-sighted and miss better long-term outcomes." },
          { text: "Expected cumulative reward", correct: true, explanation: "The standard objective is expected return: cumulative future reward, often discounted." },
          { text: "Probability of correct classification", correct: false, explanation: "That is a supervised classification objective, not the general RL objective." },
          { text: "State transitions", correct: false, explanation: "Transitions describe how the environment changes; they are not what the agent maximizes." }
        ]
      },
      {
        quizId: "1",
        quizName: "Quiz 1: Bandits & Intro",
        id: "q1_4",
        question: "Which components define a Markov Decision Process (MDP)?",
        options: [
          { text: "State space S", correct: true, explanation: "The state space contains the possible states the agent/environment can be in." },
          { text: "Action space A", correct: true, explanation: "The action space contains the actions available to the agent." },
          { text: "Transition probabilities P", correct: true, explanation: "P describes how likely next states are after a state-action pair." },
          { text: "Discount factor gamma", correct: true, explanation: "Gamma determines how future rewards are weighted in the return." }
        ]
      },
      {
        quizId: "1",
        quizName: "Quiz 1: Bandits & Intro",
        id: "q1_5",
        question: "What does the Markov property state?",
        options: [
          { text: "The future depends on the past and present equally", correct: false, explanation: "The Markov property says the past is irrelevant once the present state is known." },
          { text: "The future is independent of the past given the present", correct: true, explanation: "The current state is a sufficient summary of the relevant past information." },
          { text: "The agent must remember the full trajectory", correct: false, explanation: "A Markov state removes the need to condition on the whole history." },
          { text: "Rewards must be deterministic", correct: false, explanation: "Markov processes can be stochastic: rewards and transitions do not have to be deterministic." }
        ]
      },
      {
        quizId: "1",
        quizName: "Quiz 1: Bandits & Intro",
        id: "q1_6",
        question: "What does a policy \\(\\pi(a|s)\\) represent?",
        options: [
          { text: "The probability of taking action a in state s", correct: true, explanation: "For a stochastic policy, \\(\\pi(a|s)\\) gives the probability assigned to action a in state s." },
          { text: "The expected return of a state", correct: false, explanation: "Expected return from a state is the state-value function \\(V_\\pi(s)\\), not the policy." },
          { text: "A mapping from states to actions or action probabilities", correct: true, explanation: "A deterministic policy maps states to actions; a stochastic policy maps states to action probabilities." },
          { text: "The reward function", correct: false, explanation: "The reward function defines feedback from the environment; the policy defines the agent's behavior." }
        ]
      },
      {
        quizId: "1",
        quizName: "Quiz 1: Bandits & Intro",
        id: "q1_7",
        question: "What does the action-value function \\(q_\\pi(s,a)\\) represent?",
        options: [
          { text: "Expected return starting in state s, taking action a, then following policy \\(\\pi\\)", correct: true, explanation: "This is the definition of \\(q_\\pi(s,a)\\): take action a in state s, then follow policy \\(\\pi\\) and evaluate expected return." },
          { text: "Immediate reward after taking action a in state s", correct: false, explanation: "\\(q_\\pi\\) includes all future discounted rewards, not just the immediate reward." },
          { text: "Probability of selecting action a in state s", correct: false, explanation: "That is the policy \\(\\pi(a|s)\\), not the action-value function." },
          { text: "Optimal value function of taking action a in state s", correct: false, explanation: "\\(q_\\pi\\) is policy-specific. The optimal action-value function is \\(q^*(s,a)\\)." }
        ]
      },
      {
        quizId: "1",
        quizName: "Quiz 1: Bandits & Intro",
        id: "q1_8",
        question: "Which statements about optimal value functions are correct?",
        options: [
          { text: "v*(s) is the maximum state value over all policies", correct: true, explanation: "v*(s) is the best achievable state value when choosing the best policy." },
          { text: "q*(s,a) is the maximum action value over all policies", correct: true, explanation: "q*(s,a) is the best achievable expected return after taking action a in state s and then acting optimally." },
          { text: "Knowing v*(s) allows us to derive the optimal policy directly without model", correct: false, explanation: "v*(s) alone does not directly rank actions unless the transition model is also known." },
          { text: "Knowing q*(s,a) allows us to derive the optimal policy", correct: true, explanation: "Choose an action with maximal q*(s,a) in each state directly." },
          { text: "Not all MDPs have an optimal value function", correct: false, explanation: "In the standard discounted finite MDP setting, an optimal value function exists." },
          { text: "There can only be one optimal policy", correct: false, explanation: "There may be several optimal policies when multiple actions tie for best value." }
        ]
      },
      {
        quizId: "1",
        quizName: "Quiz 1: Bandits & Intro",
        id: "q1_9",
        question: "What is the exploration-exploitation trade-off?",
        options: [
          { text: "Choosing between maximizing current reward and gathering information", correct: true, explanation: "Exploitation uses what currently looks best; exploration collects information that may improve future decisions." },
          { text: "Choosing between deterministic and stochastic policies", correct: false, explanation: "Policy type can affect exploration, but the trade-off itself is about reward now versus information for later." },
          { text: "Balancing short-term reward and learning about the environment", correct: true, explanation: "This is the same idea: act for immediate payoff or learn more to improve future payoff." },
          { text: "Minimizing the discount factor", correct: false, explanation: "The discount factor weights future rewards; minimizing it is not the exploration-exploitation trade-off." }
        ]
      },
      {
        quizId: "1",
        quizName: "Quiz 1: Bandits & Intro",
        id: "q1_10",

    try {
      const savedMissed = localStorage.getItem("rl_missed_questions");
      if (savedMissed) {
        missedQuestionIds = new Set(JSON.parse(savedMissed));
      }
    } catch(e) {}

    function saveMissedToStorage() {
      try {
        localStorage.setItem("rl_missed_questions", JSON.stringify([...missedQuestionIds]));
      } catch(e) {}
    }

    function initTabs() {
      const tabs = [
        { id: "all", label: "All Quizzes (104 Qs)" },
        { id: "0", label: "Quiz 0: Foundations" },
        { id: "1", label: "Quiz 1: Bandits" },
        { id: "2", label: "Quiz 2/3: Value Methods" },
        { id: "4", label: "Quiz 4: Approx & DQN" },
        { id: "5", label: "Quiz 5: Policy Gradients" },
        { id: "7", label: "Quiz 7: TRPO/PPO/SAC" },
        { id: "8a", label: "Quiz 8a: IL & Offline" },
        { id: "8b", label: "Quiz 8b: Challenges" },
        { id: "9", label: "Quiz 9: IRL & Preferences" },
        { id: "10", label: "Quiz 10: Model-Based" }
      ];

      const navContainer = document.getElementById("nav-tabs");
      navContainer.innerHTML = "";
      tabs.forEach(tab => {
        const btn = document.createElement("button");
        btn.className = `btn-tab ${tab.id === currentTab ? "active" : ""}`;
        btn.textContent = tab.label;
        btn.onclick = () => {
          currentTab = tab.id;
          document.querySelectorAll(".btn-tab").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          loadQuizSet();
        };
        navContainer.appendChild(btn);
      });
    }

    function loadQuizSet(onlyMissed = false) {
      if (onlyMissed) {
        currentQuestions = QUIZ_DATA.filter(q => missedQuestionIds.has(q.id));
        if (currentQuestions.length === 0) {
          alert("No missed questions saved. Great job!");
          currentQuestions = [...QUIZ_DATA];
        }
      } else if (currentTab === "all") {
        currentQuestions = [...QUIZ_DATA];
      } else {
        currentQuestions = QUIZ_DATA.filter(q => q.quizId === currentTab);
      }

      if (document.getElementById("shuffle-toggle").checked) {
        currentQuestions.sort(() => Math.random() - 0.5);
      }

      currentIndex = 0;
      userSelections = {};
      submittedState = {};
      renderCard();
    }

    function isSingleChoice(question) {
      const correctCount = question.options.filter(o => o.correct).length;
      return correctCount === 1;
    }

    function toggleOption(optIdx) {
      const q = currentQuestions[currentIndex];
      const single = isSingleChoice(q);
      
      if (!userSelections[currentIndex]) {
        userSelections[currentIndex] = new Set();
      }

      if (single) {
        userSelections[currentIndex].clear();
        userSelections[currentIndex].add(optIdx);
      } else {
        if (userSelections[currentIndex].has(optIdx)) {
          userSelections[currentIndex].delete(optIdx);
        } else {
          userSelections[currentIndex].add(optIdx);
        }
      }
      renderCard();
    }

    function checkAnswer() {
      submittedState[currentIndex] = true;
      const q = currentQuestions[currentIndex];
      const chosen = userSelections[currentIndex] || new Set();
      
      let allCorrect = true;
      q.options.forEach((opt, idx) => {
        const isSelected = chosen.has(idx);
        if ((opt.correct && !isSelected) || (!opt.correct && isSelected)) {
          allCorrect = false;
        }
      });

      if (!allCorrect) {
        missedQuestionIds.add(q.id);
      } else {
        missedQuestionIds.delete(q.id);
      }
      saveMissedToStorage();
      renderCard();
    }

    function nextQuestion() {
      if (currentIndex < currentQuestions.length - 1) {
        currentIndex++;
        renderCard();
      } else {
        renderResults();
      }
    }

    function prevQuestion() {
      if (currentIndex > 0) {
        currentIndex--;
        renderCard();
      }
    }

    function renderCard() {
      const container = document.getElementById("quiz-container");
      if (currentQuestions.length === 0) {
        container.innerHTML = `<div class="quiz-card"><p>No questions found in this category.</p></div>`;
        return;
      }

      const q = currentQuestions[currentIndex];
      const single = isSingleChoice(q);
      const isSubmitted = !!submittedState[currentIndex];
      const examMode = document.getElementById("exam-mode-toggle").checked;
      const chosen = userSelections[currentIndex] || new Set();

      const progress = ((currentIndex + 1) / currentQuestions.length) * 100;

      let optionsHtml = q.options.map((opt, idx) => {
        const isSelected = chosen.has(idx);
        let statusClass = isSelected ? "selected" : "";

        if (isSubmitted && !examMode) {
          if (isSelected && opt.correct) {
            statusClass = "selected correct";
          } else if (isSelected && !opt.correct) {
            statusClass = "selected wrong";
          } else if (!isSelected && opt.correct) {
            statusClass = "missed";
          }
        }

        return `
          <div class="option-item ${single ? "single" : ""} ${statusClass}" onclick="${isSubmitted && !examMode ? '' : `toggleOption(${idx})`}">
            <div class="option-box"></div>
            <div class="option-content">
              <div>${opt.text}</div>
              ${isSubmitted && !examMode ? `<div class="option-explanation">${opt.explanation}</div>` : ""}
            </div>
          </div>
        `;
      }).join("");

      container.innerHTML = `
        <div class="quiz-card">
          <div class="progress-bar-container">
            <div class="progress-bar-fill" style="width: ${progress}%"></div>
          </div>
          <div class="card-meta">
            <span class="badge-module">${q.quizName}</span>
            <span class="badge-type">${single ? "Single Choice" : "Select All That Apply"}</span>
          </div>
          <div class="question-title">
            <strong>Q${currentIndex + 1}/${currentQuestions.length}:</strong> ${q.question}
          </div>
          <div class="options-list">
            ${optionsHtml}
          </div>
          <div class="card-footer">
            <button class="btn-secondary" onclick="prevQuestion()" ${currentIndex === 0 ? "disabled" : ""}>Previous</button>
            <div>
              ${(!isSubmitted && !examMode) ? `
                <button class="btn-action" onclick="checkAnswer()" ${chosen.size === 0 ? "disabled" : ""}>Submit Answer</button>
              ` : `
                <button class="btn-action" onclick="nextQuestion()">${currentIndex === currentQuestions.length - 1 ? "Complete Quiz" : "Next"}</button>
              `}
            </div>
          </div>
        </div>
      `;

      if (window.renderMathInElement) {
        renderMathInElement(container, {
          delimiters: [
            {left: "$$", right: "$$", display: true},
            {left: "\\(", right: "\\)", display: false}
          ],
          throwOnError: false
        });
      }
    }

    function renderResults() {
      const container = document.getElementById("quiz-container");
      let totalQuestions = currentQuestions.length;
      let correctCount = 0;

      currentQuestions.forEach((q, idx) => {
        const chosen = userSelections[idx] || new Set();
        let pass = true;
        q.options.forEach((opt, oIdx) => {
          const selected = chosen.has(oIdx);
          if ((opt.correct && !selected) || (!opt.correct && selected)) {
            pass = false;
          }
        });
        if (pass) correctCount++;
      });

      const percentage = Math.round((correctCount / totalQuestions) * 100);

      container.innerHTML = `
        <div class="result-summary-card">
          <h2>Quiz Completed</h2>
          <div class="result-score">${percentage}%</div>
          <p style="color: var(--text-muted);">You got <strong>${correctCount}</strong> out of <strong>${totalQuestions}</strong> questions correct.</p>
          <div class="result-actions">
            <button class="btn-action" onclick="loadQuizSet()">Restart Quiz</button>
            <button class="btn-secondary" onclick="loadQuizSet(true)">Practice Missed Questions (${missedQuestionIds.size})</button>
          </div>
        </div>
      `;
    }

    document.getElementById("shuffle-toggle").addEventListener("change", () => loadQuizSet());
    document.getElementById("exam-mode-toggle").addEventListener("change", () => renderCard());
    document.getElementById("btn-review-missed").addEventListener("click", () => loadQuizSet(true));

    initTabs();
    loadQuizSet();
  </script>
</body>
</html>
